[[questions]]
type = "MultipleChoice"
prompt.prompt = "Was gibt `yard_to_feet(7)` zurück, wenn die Funktion `return 3 * length_in_yard` enthält?"
prompt.distractors = [
  "`21` wird nur angezeigt, aber nicht zurückgegeben.",
  "`length_in_yard` bleibt als Text im Ergebnis stehen.",
  "Es entsteht ein Fehler, weil `7` kein gültiger Parametername ist."
]
answer.answer = "`21`, weil `length_in_yard` beim Funktionsaufruf durch den Wert `7` ersetzt wird."
context = "Beim Funktionsaufruf wird der Parameter im Funktionskörper durch das übergebene Argument ersetzt."
