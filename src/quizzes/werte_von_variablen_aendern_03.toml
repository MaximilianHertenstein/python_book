[[questions]]
type = "MultipleChoice"
prompt.prompt = "Warum ändert `x = 5` nicht den Wert von `y`, wenn vorher `y = x` ausgeführt wurde?"
prompt.distractors = [
  "Weil y automatisch gelöscht wird.",
  "Weil x und y sich gegenseitig überschreiben.",
  "Weil Python y nach jeder Änderung von x neu berechnet."
]
answer.answer = "Weil bei der Zuweisung y = x der damalige Wert von x kopiert wird und Variablen danach unabhängig voneinander sind."
context = "Nach der Zuweisung sind zwei Variablen unabhängig, auch wenn sie zuvor denselben Wert hatten."
