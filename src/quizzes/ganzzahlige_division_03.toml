[[questions]]
type = "MultipleChoice"
prompt.prompt = "Welche Gleichung gilt immer für Dividend, Divisor, Quotient und Rest?"
prompt.distractors = [
  "dividend = quotient + rest",
  "dividend = quotient // divisor + rest",
  "dividend = divisor // quotient * rest"
]
answer.answer = "dividend = quotient * divisor + rest, also z. B. (14 // 5) * 5 + (14 % 5) = 14."
context = "Quotient und Rest zusammen ergeben immer wieder den ursprünglichen Dividenden, wenn man sie richtig kombiniert."
id = "4f5a6b7c-6e3d-4a3a-9e2a-9d1f6b7a7c63"
