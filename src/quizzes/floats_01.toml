prompt.prompt = "Was für ein Typ ist das Ergebnis von `5 / 2`?"
prompt.distractors = [
  "int, weil beide Operanden Integer sind.",
  "str, weil Kommazahlen als Text gespeichert werden.",
  "bool, weil das Ergebnis größer als 1 ist."
