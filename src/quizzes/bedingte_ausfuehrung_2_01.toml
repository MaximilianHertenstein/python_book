answer.answer = "Weil print (im Gegensatz zu return) die Funktion nicht verlässt, sodass der Code nach dem if trotzdem ausgeführt wird."
context = "Ohne return oder else wird der Code nach dem if-Block unabhängig von der Bedingung weiter ausgeführt."
