[[questions]]
type = "MultipleChoice"
prompt.prompt = "Warum darf eine Funktion nicht `return` als Namen haben?"
prompt.distractors = [
  "Weil Funktionsnamen immer mit einem Großbuchstaben beginnen müssen.",
  "Weil `return` ein Datentyp ist.",
  "Weil Funktionsnamen keine Buchstaben enthalten dürfen."
]
answer.answer = "Weil `return` ein Schlüsselwort ist, das der Python-Interpreter für eigene Zwecke reserviert."
context = "Schlüsselwörter wie `def` und `return` dürfen nicht als Namen von Funktionen oder Variablen verwendet werden."
