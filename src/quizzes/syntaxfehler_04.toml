[[questions]]
type = "MultipleChoice"
prompt.prompt = "Ein Schüler sagt: „Der Fehler steht sicher in der letzten Zeile des Programms.“ Was stimmt an dieser Aussage nicht?"
prompt.distractors = [
  "Python zeigt niemals eine Zeilennummer an.",
  "Fehler treten immer nur in der ersten Zeile auf.",
  "Es gibt in Python keine Zeilennummern."
]
answer.answer = "Der SyntaxError kann in jeder Zeile auftreten. Python zeigt genau die Zeile an, in der das Problem erkannt wurde."
context = "Die Zeilennummer in der Fehlermeldung entspricht der tatsächlichen Fehlerstelle, nicht zwangsläufig dem Programmende."
