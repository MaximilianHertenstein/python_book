answer.answer = "Bei einer for-Schleife wird die Variable automatisch erhöht, bei einer while-Schleife muss man das selbst im Schleifenkörper tun."
context = "Das automatische Hochzählen ist einer der Hauptvorteile von for-Schleifen gegenüber while-Schleifen."
