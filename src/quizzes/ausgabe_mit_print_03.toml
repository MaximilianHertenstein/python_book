type = "MultipleChoice"
prompt.prompt = "Was passiert bei einer Funktion mit `return 'Hello'` gefolgt von `print('Goodbye')` in der nächsten Zeile?"
prompt.distractors = [
  "Beide Zeilen werden ausgeführt.",
  "Nur `print('Goodbye')` wird ausgeführt.",
  "Es entsteht ein Fehler, weil nach return kein weiterer Code stehen darf."
]
answer.answer = "Nur `return 'Hello'` wird ausgeführt. Die Funktion wird danach sofort verlassen, `print('Goodbye')` wird nie erreicht."
context = "Ein return-Statement beendet die Funktion sofort. Code danach wird nicht mehr ausgeführt."
